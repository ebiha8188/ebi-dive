<!-- スクリプトが動かない環境向けの予備（記録の引っ越しはされない） -->
<meta http-equiv="refresh" content="3; url=https://ebihanohito.com/ebi-dive/">
<script>
// 旧アドレスに残っているこのブラウザの記録を、新しいサイトへ #migrate=… で持っていく
(function () {
  var NEW = 'https://ebihanohito.com/ebi-dive/';
  var data = {};
  try {
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (/^ebi-dive-[a-z0-9-]+$/.test(k)) data[k] = localStorage.getItem(k);
    }
  } catch (e) {}
  var url = NEW;
  if (Object.keys(data).length) {
    var bytes = new TextEncoder().encode(JSON.stringify(data)), bin = '';
    for (var j = 0; j < bytes.length; j++) bin += String.fromCharCode(bytes[j]);
    url += '#migrate=' + btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  location.replace(url);
})();
</script>

<body>
<p>えびダイブ食堂は <b>ebihanohito.com</b> に引っ越しました。<br>自動で移動しています…<br><a href="https://ebihanohito.com/ebi-dive/">移動しないときはこちら</a></p>
</body>
